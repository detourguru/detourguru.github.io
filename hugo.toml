baseURL = "https://detourguru.github.io/"
locale = "ko-kr"  # Hugo 0.158+ 에서 languageCode 를 대체
defaultContentLanguage = "ko"
title = "detourguru의 블로그"
theme = "PaperMod"

# robots.txt 생성
enableRobotsTXT = true

enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", "date"]

[services.googleAnalytics]
  ID = "G-JJHM4Z3H62"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 20

[taxonomies]
  tag = "tags"
  # 필요할때 되살릴 것
  # category = "categories" 
  series = "series"

[params]
  env = "production"
  author = "detourguru"
  description = '프론트엔드 개발자 김채연이 React, TypeScript, Next.js 실무에서 부딪힌 문제와 해결 과정을 기록합니다.'
  keywords = ["프론트엔드", "React", "TypeScript", "Next.js", "Zustand", "상태 관리", "성능 최적화", "개발 블로그"]

  images = ["og-image.png"]

  [params.profile]
    role = "프론트엔드 개발자"
    location = "서울"
    activePeriod = "2025.02 ~ 현재"
    mainStack = "React, TypeScript, Next.js"
    email = "detourguru@gmail.com"
    github = "https://github.com/detourguru"

  [params.analytics.google]
    SiteVerificationTag = ""

  [params.analytics.naver]
    SiteVerificationTag = ""

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/detourguru"
  title = "GitHub"
