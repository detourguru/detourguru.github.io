  areas:
    - title: "실시간 게임 프론트엔드"
      period: "2025.05 ~ 2026.08"
      meta: "실시간 멀티플레이 게임 프론트엔드"
      scale: "20종의 게임 명령, 12종의 스텝 렌더러, 45개 도메인 Store"
      featured:
        title: "분기, 순서, 지연을 함께 처리하던 이벤트 핸들러를 책임별로 분리"
        period: "2026.02"
        problem: "소켓 이벤트 핸들러 하나가 이벤트 분기와 순서 판정, 지연 제어를 함께 처리하고 있어 이벤트를 하나 추가할 때마다 순서와 지연까지 같이 정해야 했다. 이후 서버가 순서를 결정하는 로직이 추가되며 같은 판정이 양쪽에서 수행됐고, 캐릭터 생성 연출이 끝나기 전에 후속 메시지가 먼저 실행되는 충돌이 발생했다."
        decision: "순서 판정은 서버가 단일 책임을 가져야 한다고 판단해 판정 권한을 서버로 단일화했으나, 프론트의 핸들러가 비동기 연출을 수행하는데 호출부가 완료를 기다리지 않아 재정렬로는 순서 틀어짐을 고칠 수 없었다. 서버가 정한 순서를 유지하면서 앞 메시지 처리가 끝난 뒤 다음 메시지를 소비하도록 직렬화했다."
        impl:
          - "프론트엔드의 우선순위 판정, 배치 재정렬, 고정 지연 제거"
          - "도착 순서 유지 및 메시지 처리의 재진입 방지를 위해 이전 메시지의 처리 완료를 대기하는 Queue 도입"
          - "이벤트 91종을 `type → 핸들러` 조회 테이블로 통합하고 반복되는 처리 형태를 생성 함수 9종으로 추출"
          - "애니메이션 연출 중 화면 렌더링은 대기하되 서버로 보내는 진행완료 신호는 지연되지 않도록 분리"
        result: "순서 충돌이 사라졌고 **이벤트 91종 중 50종이 공통 생성 함수 기반의 한 줄 설정으로 단순화**되었다. 동일 유형의 이벤트 추가 시 별도 처리 로직 없이 한 줄만 추가하도록 변경되었다."
      cases:
        - problem: "백그라운드 복귀 후 일부 메시지 유실"
          solution: "알림 부수효과에서 발생한 예외가 메시지 디스패치 전체를 중단시키고 있음을 확인 → 부수효과를 격리해 예외가 기능을 중단하지 않도록 구조 변경"
        - problem: "서버 재시작 시 접속자가 동일 시점에 일제히 재접속"
          solution: "재연결 대기 시간에 분산을 적용해 동시 재접속 집중을 완화"
        - problem: "오프라인 시 소켓 재시도 수 소진"
          solution: "재시도 예산의 소비 조건을 재정의해 오프라인 및 백그라운드 시도는 집계 대상에서 제외"
        - problem: "“명령을 보냈는데 반응이 없는” 원인 구분 불가"
          solution: "동작 변경에 앞서 관측을 먼저 분리해 끊김, 복구/실패, 명령 drop 경로를 각각 확인 후 모니터링 로직이 복구 동작을 막지 않도록 분리"
        - problem: "인게임 지연이 API, 소켓, 연출 중 어디서 발생하는지 불명"
          solution: "API 요청 / 소켓 수신 / 화면 반영 구간을 분리해 계측하고, 네트워크 왕복 지연은 ping RTT로 별도 측정하여 지연 발생 구간을 특정"

    - title: "노코드 게임 에디터"
      period: "2025.04 ~ 2026.08"
      meta: "노코드 게임 제작 에디터"
      scale: "엔티티 입력 폼 27종, Zod 스키마 39개, 노드형 맵 디자이너, 스크립트 편집기 등"
      featured:
        title: "그래프 데이터를 노드/엣지 자료구조로 통합"
        period: "2025.09"
        problem: "초기 맵 디자이너는 노드 좌표와 연결선을 각각 따로 관리했다. 노드가 늘어날수록 두 상태를 맞춰주는 코드가 늘었고, 노드를 옮기거나 추가할 때마다 위치를 수동으로 조정해야 했다."
        decision: "그래프라는 하나의 대상을 좌표 기반 배치와 연결이라는 두 상태로 관리하고 있어, 관계를 표현하는 자료구조인 노드/엣지 모델로 이관했다."
        impl:
          - "좌표와 연결선을 노드/엣지 단일 자료구조로 통합"
          - "직접 구현한 노드 이동, zoom, 연결 관리를 React Flow의 노드/엣지 모델과 API에 위임"
        result: "두 상태를 맞추던 동기화 코드와 수동 좌표 조정이 없어졌다."
      cases:
        - problem: "필드 타입이 늘 때마다 분기가 누적"
          solution: "변경 단위와 파일 단위가 어긋난 문제로 보고 레지스트리 구조로 전환 및 등록 누락을 타입 검사가 발견하도록 구성"
        - problem: "에디터 진입 시 조회 워터폴 개선"
          solution: "공통 데이터 선조회 및 화면 간 캐시 공유로 요청 간 순차 의존을 끊어 **데이터 조회 호출 건수 22건 → 10건 / 총 지연시간 4.6초 → 2.4초로 감소**"
        - problem: "저장할 때마다 앱이 1~2초 프리징 됨"
          solution: "전역 무효화가 원인임을 확인 후 엔티티 단위 타깃 무효화로 변경하고 무효화 매핑을 문서화"
        - problem: "태그 순서를 드래그로 바꾸면 일부 값이 사라짐"
          solution: "RHF의 재배열 API가 화면에 노출되지 않은 필드를 누락시키는 현상을 확인해 배열 전체를 직접 재배열"

    - title: "프론트엔드 성능 및 품질 개선"
      period: "2026.04 ~ 현재"
      meta: "프론트엔드 성능, 품질 게이트, 관측 체계, CI 파이프라인 구축"
      scale: "검증 게이트, ESLint 제약 룰, 테스트/e2e 체계, Sentry 커스텀 계측, GitHub Actions"
      featured:
        title: "모바일 빌드에서 불필요한 화면을 초기 번들에서 제외"
        period: "2026.04"
        problem: "프로덕션 빌드가 사실상 단일 번들이었고 PC와 모바일에서 렌더링하는 화면이 각각 상이한데, 모바일에서 쓰이는 화면의 JS 63~66%가 사용되지 않는 코드로 확인되어 최적화가 필요했다."
        decision: "분할 기준은 모바일에서 사용하지 않는 코드로 잡고, 외부 라이브러리는 분리 효과가 분명한 4개만 별도 파일로 분리했다."
        impl:
          - "에디터 전용 vendor 분리"
          - "모바일에서 PC 에디터 경로 접근을 라우팅 단계에서 차단"
          - "실제 로그인/콘텐츠 기준으로 재측정하고 결과를 기록하여 문서화"
        result: "**첫 진입 번들 JS 3,627kB → 2,280kB**, 에디터 화면 **Lighthouse Performance 89 → 97**"
      cases:
        - problem: "원거리 접속 시 첫 화면만 느림"
          solution: "범위를 서버까지 확대해 운영 배포 서버가 개발 모드로 서빙 중임을 발견하여 계측 후 [**810ms → 128ms으로 개선**](https://detourguru.github.io/posts/dev-server-as-production/)"
        - problem: "번들 최적화 이후에도 첫 화면 로딩 지표가 개선되지 않음"
          solution: "JS 크기가 지배적 요인이 아니라고 보고 같은 화면의 정적 에셋을 다시 측정해 랜딩 이미지를 WebP 전환하고 지연 로딩으로 **3.7MB → 466KB으로 개선**"
        - problem: "컨벤션을 문서로만 관리하여 강제성이 없음"
          solution: "기계적으로 판별 가능한 규칙을 lint로 이관하고 위반을 예외가 아닌 잔여 작업 목록으로 관리하여 **Hooks 위반 28 → 0건으로 개선**"
        - problem: "테마 10종의 상태 색 대비 미달"
          solution: "육안 검수 대신 대비비를 실패 조건으로 정의한 테스트로 전환"

- period: "2022.01 ~ 2024.04"
  company: "셀메이트"
  current: false
  domain: "이커머스 통합관리 SaaS의 발주 및 재고 도메인, 택배사 연동, 주문 자동 수집 파이프라인"
  stack: "PHP, Laravel, MSSQL, Classic ASP"
  team: "셀메이트 BE팀 (BE 9명)"
  areas:
    - featured:
        title: "실시간 수집과 사후 대조로 데이터 정합성 보완"
        problem: "기존 오토봇 v1은 C# 기반 클라이언트 GUI 프로그램이었으나, 대형 고객사의 주문량이 늘면서 API 연동 및 DB 저장에서 타임아웃이 발생했고, 처리 부하가 고객사 PC 환경에 따라 제각각이어서 에러 원인을 추적할 수 없었다."
        decision: "주문이 급증하는 시즌에 타임아웃을 늘려주는 것만으로는 한계가 있다고 판단해 처리 주체를 클라이언트에서 서버로 이관하고 SaaS로 재개발했다. 정합성은 실시간 수집 하나로 맞추려 하지 않고 실시간 수집 및 사후 재대조로 이원화했다."
        impl:
          - "웹으로 화면과 API 연결, Queue 기반 10분 단위 연쇄 수집"
          - "수집 구간을 1분 중첩시켜 경계 시각 누락 차단, 중복은 저장 단계에서 제거"
          - "데이터 변조가 가장 적은 새벽 4시에 스케줄러로 누락, 취소, 중복 재검증"
          - "수집 결과 조회 화면으로 운영자가 유실 여부를 직접 확인 가능"
        result: "**업체당 일 50만 건까지 수집이 가능**해졌고 이관 이후 현장 인력의 수동 대응 경로가 축소되었다. 신규 쇼핑몰 30여 곳 유치와 기존 대형 고객사 상위 요금제 전환에 기여했다."
      cases:
        - problem: "택배사별 API 요청/응답이 상이"
          solution: "순차적으로 외부 API 연동 범위를 확대해 **송장 발행 지원 쇼핑몰 40여 곳으로 확대에 기여**"
        - problem: "명세 없는 레거시 코드 이관"
          solution: "특정 업체 전용 코드 및 하드코딩이 섞여 유지/폐기 판단 근거가 없는 상황에서 기능별 로그를 심어 실사용 업체와 빈도를 실측하였음. 빈도가 낮아도 대형 고객사가 쓰면 유지하는 기준으로 영업/기획과 범위를 확정하였음."
        - problem: "특정 고객사에서만 나는 에러 문의가 반복"
          solution: "문제가 된 실제 주문 데이터를 DB에서 추출해 QA 서버에서 그대로 재현하는 방식으로 대응했다. 추측으로 수정하지 않고 어떤 데이터가 어떤 코드에서 문제를 야기하는지 특정한 뒤 수정했음."
